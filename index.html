<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema CCH - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./estilo.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom shadow-sm">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#" onclick="App.loadSection('inicio')">
                <i class="fas fa-school me-2"></i> Dashboard CCH
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto sidebar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-section="inicio">
                            <i class="fas fa-house me-2"></i> Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="maga1">
                            <i class="fas fa-chart-column me-2"></i> MAGA 1
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="maga2">
                            <i class="fas fa-chart-column me-2"></i> MAGA 2
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="maga3">
                            <i class="fas fa-chart-column me-2"></i> MAGA 3
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="cyc">
                            <i class="fas fa-laptop-code me-2"></i> CYC 1
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="cyc2">
                            <i class="fas fa-laptop-code me-2"></i> CYC 2
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-section="estadistica">
                            <i class="fas fa-chart-simple me-2"></i> Estadística
                        </a>
                    </li>
                </ul>

                <div class="d-flex gap-2">
                    <!-- ✅ NUEVA FUNCIÓN -->
                    <button id="btn-unlock" class="btn btn-outline-info btn-sm" onclick="App.openAdminFlow()">
                        <i class="fas fa-pen-to-square me-1"></i> Crear Reporte
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        <div class="card shadow-sm mb-3">
            <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <h5 id="view-title" class="mb-0">Inicio</h5>
                    <small class="text-muted" id="view-subtitle">Selecciona una sección del menú</small>
                </div>

                <div class="d-flex gap-2 align-items-center">
                    <input id="tableSearch" class="form-control form-control-sm" placeholder="Buscar por Cuenta..."
                        onkeyup="App.filterTable()" style="width:220px;">
                </div>
            </div>
        </div>

        <section id="inicio" class="active">
        </section>

        <section id="reporte-view" class="d-none">
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-body d-flex flex-wrap gap-2 justify-content-end">
                            <span class="badge bg-primary">Total: <span id="stat-total">0</span></span>
                            <span class="badge bg-success">Promedio asistencia: <span id="stat-avg">0%</span></span>
                            <span class="badge bg-warning text-dark">Riesgo (&lt;80%): <span
                                    id="stat-risk">0</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered table-hover mb-0 text-center">
                            <thead id="mainAttendanceHead"></thead>
                            <tbody id="mainAttendanceBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
