<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema CCH - Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./estilo.css">
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark border-bottom shadow-sm pb-0">
    <div class="container-fluid d-flex flex-column align-items-start">
      <div class="d-flex justify-content-between align-items-center w-100 mb-2 mt-1 gap-2">
        <a class="navbar-brand fw-bold m-0" href="#" id="home-link">
          <i class="fas fa-school me-2"></i>Dashboard CCH
        </a>

        <div class="d-flex gap-2 flex-wrap justify-content-end">
          <!-- Botón Forms Eventos: abre el formulario en una pestaña nueva -->
          <a
            id="btn-forms-eventos"
            class="btn btn-warning btn-sm"
            href="https://docs.google.com/forms/d/e/1FAIpQLSdRT8_TkBACvMPxC90dPRVGrFpq_CH90EDQWzXcEBh5ddOcug/viewform?usp=dialog"
            target="_blank"
            rel="noopener noreferrer"
            title="Abrir Forms Eventos"
          >
            <i class="fas fa-calendar-check"></i>
            <span class="d-none d-sm-inline">Forms Eventos</span>
            <i class="fas fa-arrow-up-right-from-square fa-xs ms-1"></i>
          </a>

          <button id="btn-unlock" class="btn btn-outline-info btn-sm" type="button" title="Crear reporte">
            <i class="fas fa-plus"></i>
            <span class="d-none d-sm-inline">Reporte</span>
          </button>

          <button id="btn-sync" class="btn btn-success btn-sm" type="button" title="Sincronizar reporte actual" disabled>
            <i class="fas fa-rotate"></i>
            <span class="d-none d-sm-inline">Sync</span>
          </button>
        </div>
      </div>

      <div class="w-100 menu-deslizable">
        <ul id="report-menu" class="navbar-nav flex-row flex-nowrap sidebar-nav gap-3 pb-2">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-section="inicio">Inicio</a>
          </li>
          <li class="nav-item d-none" id="menu-loading">
            <span class="nav-link text-secondary">
              <i class="fas fa-spinner fa-spin"></i> Cargando reportes...
            </span>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div class="card shadow-sm mb-3">
      <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h5 id="view-title" class="mb-0">Inicio</h5>
          <small class="text-muted" id="view-subtitle">Panel de control</small>
        </div>

        <input
          id="tableSearch"
          type="search"
          class="form-control form-control-sm"
          placeholder="Filtrar información..."
          aria-label="Filtrar información"
          style="width: 100%; max-width: 250px"
          disabled
        >
      </div>
    </div>

    <div id="alert-container" aria-live="polite"></div>

    <section id="inicio" class="text-center py-5">
      <h4 class="text-muted">Gestión Escolar CCH</h4>
      <p class="mb-0">Selecciona un reporte para consultar la información actualizada.</p>
    </section>

    <section id="reporte-view" class="d-none">
      <div class="card shadow-sm mb-3">
        <div class="card-body d-flex justify-content-end gap-3 flex-wrap p-2">
          <span class="badge bg-primary">Registros: <span id="stat-total">0</span></span>
          <span class="badge bg-success">Promedio: <span id="stat-avg">N/A</span></span>
          <span class="badge bg-danger">En riesgo: <span id="stat-risk">0</span></span>
        </div>
      </div>

      <div class="table-responsive shadow-sm bg-white rounded">
        <table class="table table-sm table-bordered table-hover mb-0">
          <thead id="mainAttendanceHead" class="table-dark text-center"></thead>
          <tbody id="mainAttendanceBody" class="text-center"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal para crear reporte (reemplaza los prompt() del navegador) -->
  <div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="adminForm" autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="adminModalLabel">
            <i class="fas fa-lock me-2"></i>Crear nuevo reporte
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="adminPass" class="form-label">Contraseña de administrador</label>
            <input type="password" class="form-control" id="adminPass" required autocomplete="current-password">
          </div>
          <div class="mb-0">
            <label for="reportName" class="form-label">Nombre del nuevo reporte</label>
            <input type="text" class="form-control" id="reportName" required maxlength="80" placeholder="Ej. Grupo 501">
          </div>
          <div id="adminError" class="text-danger small mt-2 d-none"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="adminSubmit">
            <i class="fas fa-plus"></i> Crear
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
