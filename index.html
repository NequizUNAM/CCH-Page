<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema CCH - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./estilo.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" onclick="App.loadSection('inicio')">
                <i class="fas fa-school me-2"></i> Dashboard CCH
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto sidebar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#" data-section="inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga1">MAGA 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga2">MAGA 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga3">MAGA 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="cyc">CYC 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="cyc2">CYC 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="est1">Estadística 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="est2">Estadística 2</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button id="btn-unlock" class="btn btn-outline-info btn-sm" onclick="App.openAdminFlow()">
                        <i class="fas fa-plus me-1"></i> Crear reporte
                    </button>
                    <button id="btn-sync" class="btn btn-success btn-sm" onclick="App.syncAttendance()">
                        <i class="fas fa-rotate me-1"></i> Sincronizar
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <main class="container-fluid py-3">
        <div class="card shadow-sm mb-3">
            <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <h5 id="view-title" class="mb-0">Inicio</h5>
                    <small class="text-muted" id="view-subtitle">Selecciona una sección</small>
                </div>
                <input id="tableSearch" class="form-control form-control-sm" placeholder="Buscar Cuenta o Nombre..." onkeyup="App.filterTable()" style="width:250px;">
            </div>
        </div>
        <section id="inicio" class="active text-center py-5">
            <h4 class="text-muted">Bienvenido, Pedro</h4>
            <p>Selecciona un grupo para gestionar asistencias y calificaciones.</p>
        </section>
        <section id="reporte-view" class="d-none">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body d-flex justify-content-end gap-2 p-2">
                    <span class="badge bg-primary">Total: <span id="stat-total">0</span></span>
                    <span class="badge bg-success">Promedio: <span id="stat-avg">0%</span></span>
                    <span class="badge bg-danger">Riesgo: <span id="stat-risk">0</span></span>
                </div>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered table-hover mb-0">
                            <thead id="mainAttendanceHead" class="table-dark text-center"></thead>
                            <tbody id="mainAttendanceBody" class="text-center"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
