<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema CCH - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark border-bottom shadow-sm pb-0">
        <div class="container-fluid d-flex flex-column align-items-start">
            
            <div class="d-flex justify-content-between align-items-center w-100 mb-2 mt-1">
                <a class="navbar-brand fw-bold m-0" href="#" onclick="App.loadSection('inicio')">
                    <i class="fas fa-school me-2"></i> Dashboard CCH
                </a>
                <div class="d-flex gap-2">
                    <button id="btn-unlock" class="btn btn-outline-info btn-sm" onclick="App.openAdminFlow()" title="Crear Reporte">
                        <i class="fas fa-plus"></i> <span class="d-none d-sm-inline">Reporte</span>
                    </button>
                    <button id="btn-sync" class="btn btn-success btn-sm" onclick="App.syncAttendance()" title="Sincronizar">
                        <i class="fas fa-rotate"></i> <span class="d-none d-sm-inline">Sync</span>
                    </button>
                </div>
            </div>

            <div class="w-100 menu-deslizable">
                <ul class="navbar-nav flex-row flex-nowrap sidebar-nav gap-3 pb-2">
                    <li class="nav-item"><a class="nav-link active" href="#" data-section="inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga1">MAGA 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga2">MAGA 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="maga3">MAGA 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="cyc">CYC 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="cyc2">CYC 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="est1">Estadística 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-section="est2">Estadística 2</a></li>
                </ul>
            </div>

        </div>
    </nav>
    <main class="container-fluid py-3">
        <div class="card shadow-sm mb-3">
            <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <h5 id="view-title" class="mb-0">Inicio</h5>
                    <small class="text-muted" id="view-subtitle">Panel de Control</small>
                </div>
                <input id="tableSearch" class="form-control form-control-sm" placeholder="Filtrar por cuenta o nombre..." onkeyup="App.filterTable()" style="width:250px;">
            </div>
        </div>
        <section id="inicio" class="active text-center py-5">
            <h4 class="text-muted">Gestión Escolar CCH</h4>
            <p>Selecciona un grupo para ver datos actualizados.</p>
        </section>
        <section id="reporte-view" class="d-none">
            <div class="card shadow-sm mb-3">
                <div class="card-body d-flex justify-content-end gap-3 p-2">
                    <span class="badge bg-primary">Alumnos: <span id="stat-total">0</span></span>
                    <span class="badge bg-success">Promedio: <span id="stat-avg">0%</span></span>
                    <span class="badge bg-danger">Riesgo: <span id="stat-risk">0</span></span>
                </div>
            </div>
            <div class="table-responsive shadow-sm bg-white rounded">
                <table class="table table-sm table-bordered table-hover mb-0">
                    <thead id="mainAttendanceHead" class="table-dark text-center"></thead>
                    <tbody id="mainAttendanceBody" class="text-center"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
